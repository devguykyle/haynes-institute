---
layout: default
---

<article class="page-content resource-page">
  <p class="eyebrow">{{ page.category }}</p>
  <h1>{{ page.title }}</h1>
  <p class="lede">{{ page.summary }}</p>
  <dl class="resource-meta">
    {% if page.author %}<div><dt>Author</dt><dd>{{ page.author }}</dd></div>{% endif %}
    {% if page.date_text %}<div><dt>Date</dt><dd>{{ page.date_text }}</dd></div>{% endif %}
    {% if page.status %}<div><dt>Status</dt><dd>{{ page.status }}</dd></div>{% endif %}
  </dl>
  {{ content }}
</article>
