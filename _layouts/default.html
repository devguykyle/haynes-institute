<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body class="{{ page.body_class }}">
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand__mark">H</span>
        <span>The Haynes Institute</span>
      </a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="{{ '/resources/' | relative_url }}">Resources</a>
        <a href="{{ '/guides/' | relative_url }}">Guides</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
      </nav>
    </header>
    <main class="site-main">
      {{ content }}
    </main>
    <footer class="site-footer">
      <p>&copy; {{ site.time | date: '%Y' }} The Haynes Institute</p>
      <p>Truthful memory, patient study, and public good.</p>
    </footer>
  </body>
</html>
