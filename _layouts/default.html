<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
    <link rel="shortcut icon" href="{{ '/favicon.svg' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>
  <body class="{{ page.body_class }}">
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand__mark">H</span>
        <span>The Haynes Institute</span>
      </a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="{{ '/resources/' | relative_url }}">Resources</a>
        <a href="{{ '/files/' | relative_url }}">Biographies</a>
        <a href="{{ '/courses/' | relative_url }}">Courses</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
      </nav>
    </header>
    <main class="site-main">
      {{ content }}
    </main>
    <footer class="site-footer">
      <p>&copy; {{ site.time | date: '%Y' }} The Haynes Institute</p>
      <p>Truthful memory, patient study, and public good.</p>
    </footer>
    {% if page.video_modal %}
      <script src="{{ '/assets/js/video-modal.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
    {% endif %}
    <!-- Cloudflare Web Analytics -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "695e89458f1145768b114da110fdf5c8"}'></script>
    <!-- End Cloudflare Web Analytics -->
  </body>
</html>
